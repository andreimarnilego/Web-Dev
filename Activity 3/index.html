<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Activity 3</title>
    <link rel="icon" href="../assets/img/Logo.svg" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<style>
    .container-fluid.shadow {
        background: rgba(17, 24, 39, 0.8);
        border-bottom: 2px solid #ffb52e;
    }

    .card {
        background: #111827;
        border: 1px solid #374151;
        border-radius: 12px;
        overflow: hidden;
        color: white;
        transition: transform 0.1s ease-out, box-shadow 0.2s;
    }

    .card-img-top {
        background: radial-gradient(circle,
                color-mix(in srgb, var(--race-color, #244b78) 80%, #172b45) 0%,
                #172b45 55%,
                #0b1424 100%);

        width: 100%;
        height: 300px;
        object-fit: cover;
        object-position: 50% 10%;
    }

    .card-body {
        background: linear-gradient(145deg,
                color-mix(in srgb, var(--race-color, #1f2937) 10%, #1f2937),
                #111827);

        color: #ffffff;
        border-top: 1px solid #374151;
    }

    .page-item a {
        color: aliceblue;
    }

    #searchInput {
        background: #111827;
        border: 1px solid #374151;
        color: #fff;
    }

    .page-link {
        border-color: #374151;
    }

    .page-link:hover {
        border-color: #FFB52E;
        color: #FFB52E;
    }
</style>

<body>
    <div class="container-fluid shadow mb-3">
        <div class="row">
            <div class="col-6">
                <div class="d-flex flex-row" style="margin-left: 90px;">
                    <img src="assets/img/Dragon_Ball_Super.png" class="px-2" style="height: 70px;">
                </div>
            </div>
            <div class="col-6 px-5 d-flex justify-content-end">
                <div class="d-flex flex-row rounded-5 p-4" style="width: 100%; max-width: 380px;">
                    <input type="text" placeholder="Enter a character name..." class="form-control rounded-start-pill"
                        id="searchInput">
                    <div class="btn btn-primary rounded-end-pill" onclick="getCharacters()">
                        Search
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="text-center my-5" id="loader" style="display: none;">
            <div class="spinner-border text-light"></div>
        </div>
        <div class="row" id="parent"></div>
    </div>

    <div class="container">
        <nav aria-label="Page navigation example">
            <ul class="pagination my-4">
                <li class="page-item"><a class="page-link" onclick="prev()">Previous</a></li>
                <li class="page-item"><a class="page-link" id="currentPage">1</a></li>
                <li class="page-item"><a class="page-link" onclick="next()">Next</a></li>
            </ul>
        </nav>
    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <script>
        const raceColors = [
            { race: "Saiyan", color: "#FFB52E" },
            { race: "Human", color: "#4CAF50" },
            { race: "Namekian", color: "#2ECC71" },
            { race: "Majin", color: "#E879C5" },
            { race: "Frieza Race", color: "#A78BFA" },
            { race: "Android", color: "#38BDF8" },
            { race: "Jiren Race", color: "#EF4444" },
            { race: "God", color: "#FACC15" },
            { race: "Angel", color: "#67E8F9" },
            { race: "Evil", color: "#B91C1C" },
            { race: "Nucleico", color: "#F97316" },
            { race: "Unknown", color: "#9CA3AF" }
        ];

        var page = 1;
        var perPageLoad = 12;
        var lastPage = 1;

        var elParent = document.getElementById('parent');
        var elCurrentPage = document.getElementById('currentPage');
        var elSearch = document.getElementById("searchInput");
        var elLoader = document.getElementById('loader');

        function hasCharacterData(charac) {
            return charac &&
                charac.name &&
                charac.image &&
                charac.race;
        }

        const getCharacters = async () => {
            elParent.innerHTML = '';
            elLoader.style.display = 'block';
            elCurrentPage.innerHTML = page;

            var url = 'https://dragonball-api.com/api/characters?page=' + page + '&limit=' + perPageLoad;
            if (elSearch.value) {
                url = 'https://dragonball-api.com/api/characters?name=' + elSearch.value;
            }
            var response = await fetch(url);
            var data = await response.json();
            var characters = data.items || data;
            lastPage = data.meta ? data.meta.totalPages : 1;
            elLoader.style.display = 'none'; 

            for (const charac of characters) {
                if (!hasCharacterData(charac)) { continue; }

                var id = charac.id;
                var name = charac.name;
                var race = charac.race;
                var image = charac.image;

                const raceColor = raceColors.find(
                    item => item.race === race
                )?.color || "#244b78";

                elParent.innerHTML += `
                <div class="col-3 pt-4">
                <div class="card" style="--race-color: ` + raceColor + `; cursor: pointer;" onclick="location.href='view.html?id=` + id + `&page=` + page + `'">
                    <img src="`+ image + `" class="card-img-top" alt="` + name + `">
                    <div class="card-body">
                        <div class="h4 fw-bold mb-2" style="color: #fff;">` + name + `</div>
                        <div class="px-3 py-1 fw-bold text-uppercase" style="background-color: ` + raceColor + `; 
                        width: fit-content; border-radius: 50rem; font-size: 0.75rem; letter-spacing: 1px; color: #111827;">` + race + `</div>
                    </div>
                </div>
            </div>
                `;
            }
        }

        function prev() {
            page -= 1;
            if (page == 0) {
                page = lastPage;
            }
            getCharacters();
        }

        function next() {
            page += 1;
            if (page > lastPage) {
                page = 1;
            }
            getCharacters();
        }

        getCharacters();
    </script>
    <script src="assets/js/script.js"></script>
</body>

</html>
