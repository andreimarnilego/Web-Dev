<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Activity 1</title>
    <link rel="icon" href="../assets/img/Logo.svg" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .h1 {
            color: #18212f;
            font-family: 'Inter';
        }

        .card {
            height: 100%;
            min-height: 100px;
            border: 0;
            border-radius: 12px;
            background: transparent;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                border-color 0.3s ease;
            will-change: transform;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(57, 64, 189, 0.6),
                0 0 15px rgba(15, 177, 246, 0.15);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 0;
        }
    </style>
</head>

<body>
    <div class="h1 text-center mb-4 p-2 fw-bold"> Straw Hat Pirates </div>
    <div class="container p-2">

        <div class="row">
            <div class="col-4 p-1">
                <div class="card">
                    <img src="./assets/img/robin.jpg" alt="image">
                </div>
            </div>
            <div class="col-5 p-1">
                <div class="card">
                    <img src="./assets/img/zoro.jpg" alt="image">
                </div>
            </div>
            <div class="col-3 p-1">
                <div class="card">
                    <img src="./assets/img/usopp.jpg" alt="image">
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-3">
                <div class="row">
                    <div class="col p-1">
                        <div class="card">
                            <img src="./assets/img/sanji.jpg" alt="image">
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col p-1">
                        <div class="card">
                            <img src="./assets/img/brook.jpg" alt="image">
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="row">
                    <div class="col p-1">
                        <div class="card">
                            <img src="./assets/img/luffy.jpg" alt="image">
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col p-1">
                        <div class="card">
                            <img src="./assets/img/chopper.jpg" alt="image">

                    </div>
                    <div class="col p-1">
                        <div class="card">
                            <img src="./assets/img/franky.jpg" alt="image">

                    </div>
                </div>
            </div>
            <div class="col-3">
                <div class="row">
                    <div class="col p-1">
                        <div class="card">
                            <img src="./assets/img/nami.jpg" alt="image">
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col p-1">
                        <div class="card">
                            <img src="./assets/img/jinbe.jpg" alt="image">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>

</html>
