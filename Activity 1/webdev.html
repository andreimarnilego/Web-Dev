<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web Development</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">
    <style>
        .card {
            height: 100%;
            min-height: 100px;
            border: 0;
            border-radius: 12px;
            background: transparent;
            box-shadow: 0 8px 24px rgba(17, 22, 30, 0.16);
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 0;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1rem;
            border: 1px solid rgba(88, 126, 251, 0.28);
            border-radius: 999px;
            background: rgba(88, 126, 251, 0.12);
            color: #253348;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .back-btn:hover,
        .back-btn:focus-visible {
            transform: translateY(-2px);
            background: rgba(88, 126, 251, 0.18);
            box-shadow: 0 12px 24px rgba(75, 107, 242, 0.18);
            color: #253348;
        }
    </style>
</head>

<body>
    <div class="m-3">
        <a href="index.html" class="btn back-btn">Back</a>
    </div>
    <div class="container p-2">

        <div class="row">
            <div class="col-4 p-1">
                <div class="card">
                    <img src="./assets/img/webdev/img_9.png" alt="image">
                </div>
            </div>
            <div class="col-5 p-1">
                <div class="card">
                    <img src="./assets/img/webdev/img_5.jpeg" alt="image">
                </div>
            </div>
            <div class="col-3 p-1">
                <div class="card">
                    <img src="./assets/img/webdev/img_4.jpeg" alt="image">
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-3 p-1">
                <div class="card h-100">
                    <img src="./assets/img/webdev/img_8.jpeg" alt="image">
                </div>
            </div>
            <div class="col-6">
                <div class="row">
                    <div class="col p-1">
                        <div class="card">
                            <img src="./assets/img/webdev/img_6.jpg" alt="image">
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col p-1">
                        <div class="card">
                            <img src="./assets/img/webdev/img_7.jpg" alt="image">
                        </div>
                    </div>
                    <div class="col p-1">
                        <div class="card">
                            <img src="./assets/img/webdev/img_3.jpeg" alt="image">
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-3">
                <div class="row">
                    <div class="col p-1">
                        <div class="card">
                            <img src="./assets/img/webdev/img_1.JPG" alt="image">
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col p-1">
                        <div class="card">
                            <img src="./assets/img/webdev/img_2.jpeg" alt="image">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>

</html>
