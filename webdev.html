<!doctype html>
<html lang="en">

<head>

    <title>Web Development</title>
    <link rel="icon" href="assets/img/Logo.svg" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
    <style>

        .iframe-preview {
            width: 100%;
            height: 300px;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
        }

        .iframe-preview iframe {
            width: 600px;
            height: 600px;
            border: none;
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
        }

        .card {
            background: #eeeefa;
            border: none;
        }

        .card .h3,
        p {
            color: #18212f;
            font-family: 'Poppins', 'sans-serif';
        }

        .h1 {
            color: #18212f;
            font-family: 'Inter';
        }

        .card-btn {
            border-radius: 999px;
            padding: 0.95rem 1.9rem;
            max-width: 150px;
            font-weight: 600;
            letter-spacing: 0.01em;
            background: linear-gradient(135deg, #4B6BF2 0%, #6D8DFF 100%);
            color: #fff;
            border: none;
            box-shadow: 0 18px 36px rgba(75, 107, 242, 0.24);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .card-btn:hover,
        .card-btn:focus {
            transform: translateY(-2px);
            box-shadow: 0 22px 44px rgba(75, 107, 242, 0.28);
            background: linear-gradient(135deg, #3458E3 0%, #657CFF 100%);
        }
    </style>
</head>

<body>
    <div class="h1 text-center mb-4 p-2 fw-bold">Web Development projects</div>
    <div class="container">

                    <div class="card-body">
                        <div class="iframe-preview">
                            <iframe src="https://andreimarnilego.github.io/Web-Dev/Activity%201/index.html"
                                scrolling="no"></iframe>
                        </div>
                        <div class="h3 mt-5 fw-bold">Activity 1</div>
                        <p class="card-text my-3">A bento layout gallery of the Straw Hat Pirates from an anime series
                            One
                            Piece.</p>
                        <a href="https://andreimarnilego.github.io/Web-Dev/Activity%201/index.html"
                            class="btn card-btn" target="_blank">View Project</a>
                    </div>
                </div>
            </div>

            <div class="col-4">
                <div class="card shadow rounded-5 p-2" style="max-width: 500px; height: 100%;">
                    <div class="card-body">
                        <div class="iframe-preview">
                            <iframe src="https://andreimarnilego.github.io/Web-Dev/Activity%202/index.html"
                                scrolling="no"></iframe>
                        </div>
                        <div class="h3 mt-5 fw-bold">Activity 1</div>
                        <p class="card-text my-3">A bento layout gallery of the Straw Hat Pirates from an anime series
                            One
                            Piece.</p>
                        <a href="https://andreimarnilego.github.io/Web-Dev/Activity%202/index.html"
                            class="btn card-btn" target="_blank">View Project</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
